name: HandyIOS
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  HandyKit:
    path: Packages/HandyKit
settings:
  base:
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HandyIOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Handy
        UILaunchScreen: {}
    entitlements:
      path: App/HandyIOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mhinolv.handyios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhinolv.handyios
    dependencies:
      - package: HandyKit
      - target: HandyKeyboard
        embed: true
  HandyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Info.plist", "*.entitlements"]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Handy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: false
    entitlements:
      path: Keyboard/HandyKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mhinolv.handyios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhinolv.handyios.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: HandyKit
schemes:
  HandyIOS:
    build:
      targets:
        HandyIOS: all
        HandyKeyboard: all
