name: HandyIOS
options:
  deploymentTarget:
    iOS: "26.0"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.3
  HandyKit:
    path: Packages/HandyKit
settings:
  base:
    DEVELOPMENT_TEAM: "V8X3GYRTNK"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HandyIOS:
    type: application
    platform: iOS
    sources:
      - path: Keyboard
        includes: ["KeyboardViewController.swift", "ManualKeyboardView.swift", "KeyboardAppLauncher.swift", "ResultConsumer.swift"]
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Handy
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "handyIOS uses the microphone to record your dictation. Audio stays on this iPhone."
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.mhinolv.handyios.dictation
            CFBundleURLSchemes: [handyios]
    entitlements:
      path: App/HandyIOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mhinolv.handyios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhinolv.handyios
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "KeyboardViewController.swift ManualKeyboardView.swift KeyboardAppLauncher.swift ResultConsumer.swift"
    dependencies:
      - package: HandyKit
      - package: FluidAudio
      - target: HandyKeyboard
        embed: true
  HandyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        excludes: ["Info.plist", "*.entitlements"]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Handy
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/HandyKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.mhinolv.handyios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mhinolv.handyios.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: HandyKit
schemes:
  HandyIOS:
    build:
      targets:
        HandyIOS: all
        HandyKeyboard: all
